<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kova Media Group">
  <!--
    The Kova mark, lifted verbatim from the brand logotype: four rounded
    equalizer bars in #14B8A6. The rect geometry below is the artwork's own,
    only translated and scaled to sit centred on the square — nothing here is
    redrawn by hand.

    The ground is the identity's deep navy. At 16px the mark needs a solid
    field behind it; teal on white loses the two short outer bars entirely.
  -->
  <rect width="512" height="512" rx="104" fill="#0B1120" />
  <g transform="translate(140.5 106) scale(0.882) translate(0 -40)" fill="#14B8A6">
    <rect x="0" y="140" width="36" height="140" rx="18" ry="18" />
    <rect x="70" y="40" width="40" height="340" rx="20" ry="20" />
    <rect x="150" y="100" width="40" height="260" rx="20" ry="20" />
    <rect x="230" y="160" width="32" height="140" rx="16" ry="16" />
  </g>
</svg>
